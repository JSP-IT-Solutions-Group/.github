# Example: .github/workflows/release-readiness.yml in a consuming repository.
# Checks pull requests to release branches, release tags and manual runs.
# Read-only: it does not publish anything. Publishing stays a separate,
# human-approved workflow.

name: Release readiness

on:
  pull_request:
    branches: ["release/**"]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to check (e.g. 1.2.3). Leave empty to use the version files.
        type: string
        required: false

permissions:
  contents: read

jobs:
  release-readiness:
    permissions:
      contents: read
    # Pin `uses:` and `tooling-ref` to the same tag, or better the same commit SHA.
    uses: JSP-IT-Solutions-Group/.github/.github/workflows/release-readiness.yml@release-readiness-v1
    with:
      tooling-ref: release-readiness-v1
      version: ${{ inputs.version }}
