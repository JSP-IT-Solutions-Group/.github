# Example: verify the checksums of binaries built earlier in the same run.
# The build job uploads dist/ (including SHA256SUMS) as an artifact; the
# release-readiness job downloads and verifies it. No secrets are used and
# nothing is published.

name: Release readiness (binaries)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release files
        run: |
          # Replace with the project's real build.
          mkdir -p dist
          printf 'example build output\n' > dist/example-linux-x64.tar.gz
          (cd dist && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          retention-days: 3

  release-readiness:
    needs: build
    permissions:
      contents: read
    uses: JSP-IT-Solutions-Group/.github/.github/workflows/release-readiness.yml@release-readiness-v1
    with:
      tooling-ref: release-readiness-v1
      project-type: binary
      artifact-name: release-files

  # A publishing job, if any, belongs in a separate workflow or behind a
  # protected environment with required reviewers. It is intentionally not
  # part of this example.
