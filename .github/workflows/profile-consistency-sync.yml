# Reusable workflow: keep a profile README in sync by opening (or updating) a
# pull request with
#   - the JSP-Product counts and generated solution list (English catalogue), and/or
#   - the generated list of published open-source projects (public GitHub
#     repositories of an account).
# It never pushes to the default branch and never merges; a person reviews
# every change. If the data is unavailable, nothing happens.
#
# The calling job must grant `contents: write` and `pull-requests: write`, and
# the repository must allow GitHub Actions to create pull requests
# (Settings → Actions → General → Workflow permissions).
#
# Documentation: docs/profile-consistency.md

name: Profile sync

on:
  workflow_call:
    inputs:
      profile-path:
        description: README to update, relative to the caller repository root.
        type: string
        default: README.md
      catalogue:
        description: Sync the JSP-Product counts and solution list.
        type: boolean
        default: true
      catalogue-url:
        description: English catalogue source(s), tried in order and separated by "|" (/catalogue.json first, the overview page as a fallback).
        type: string
        default: https://jsp-it.com/catalogue.json|https://jsp-it.com/products_jsp_overview
      projects-owner:
        description: GitHub account whose public, released, licensed repositories are listed between the github-projects markers. Empty skips the projects sync.
        type: string
        default: ""
      projects-format:
        description: "Project list format: list or table."
        type: string
        default: list
      projects-exclude:
        description: Comma-separated repository names to leave out of the project list.
        type: string
        default: ""
      branch:
        description: Branch the sync commits to; one pull request is kept open from it.
        type: string
        default: automation/jsp-catalogue-sync
      attempts:
        description: How many times to try when the data is unavailable (for example the site's bot protection).
        type: number
        default: 4
      retry-delay-seconds:
        description: Seconds to wait between attempts.
        type: number
        default: 90
      tooling-ref:
        description: Ref of JSP-IT-Solutions-Group/.github to load the scripts from. Use the same ref as in `uses:`.
        type: string
        default: profile-consistency-v1
      runs-on:
        description: Runner label (needs bash, git, gh and Python 3.11+).
        type: string
        default: ubuntu-24.04
    outputs:
      changed:
        description: true when the profile needed changes.
        value: ${{ jobs.sync.outputs.changed }}
      unavailable:
        description: true when catalogue or GitHub data could not be read.
        value: ${{ jobs.sync.outputs.unavailable }}
      pull-request:
        description: URL of the opened or updated pull request.
        value: ${{ jobs.sync.outputs.pull-request }}
      branch:
        description: Branch of the sync pull request (for starting required checks on it).
        value: ${{ jobs.sync.outputs.branch }}

permissions:
  contents: read

jobs:
  sync:
    name: Sync profile
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.combine.outputs.changed }}
      unavailable: ${{ steps.combine.outputs.unavailable }}
      pull-request: ${{ steps.pr.outputs.url }}
      branch: ${{ inputs.branch }}
    steps:
      - name: Check out the repository with the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JSP-IT-Solutions-Group/.github
          ref: ${{ inputs.tooling-ref }}
          path: .profile-consistency-tooling
          persist-credentials: false
          sparse-checkout: profile-consistency

      - name: Update the profile from the catalogue
        id: sync
        if: inputs.catalogue
        shell: bash
        working-directory: project
        env:
          SYNC_TOOL: ${{ github.workspace }}/.profile-consistency-tooling/profile-consistency/sync_profile.py
          PROFILE_PATH: ${{ inputs.profile-path }}
          CATALOGUE_URL: ${{ inputs.catalogue-url }}
          SYNC_ATTEMPTS: ${{ inputs.attempts }}
          SYNC_RETRY_DELAY: ${{ inputs.retry-delay-seconds }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/sync-output.txt"
          summary="$RUNNER_TEMP/sync-summary.md"
          attempts=$(( SYNC_ATTEMPTS < 1 ? 1 : SYNC_ATTEMPTS ))
          for attempt in $(seq 1 "$attempts"); do
            : > "$out"; : > "$summary"
            status=0
            # Nothing is written to the README when the data is unavailable (exit 3).
            python3 "$SYNC_TOOL" --profile "$PROFILE_PATH" --catalogue "$CATALOGUE_URL" --write \
              --pr-body "$RUNNER_TEMP/pr-body-catalogue.md" \
              --summary-file "$summary" --github-output "$out" || status=$?
            echo "Attempt $attempt/$attempts: sync exit code $status (0 done, 2 profile error, 3 catalogue unavailable)"
            if [ "$status" -ne 3 ] || [ "$attempt" -eq "$attempts" ]; then break; fi
            echo "Catalogue data unavailable; retrying in ${SYNC_RETRY_DELAY}s."
            sleep "$SYNC_RETRY_DELAY"
          done
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          {
            cat "$out"
            echo "attempts-used=$attempt"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 3 ]; then
            echo "::warning title=Catalogue sync::Catalogue data unavailable after $attempts attempts; nothing was changed. The next scheduled run tries again."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Update the published open-source projects
        id: projects
        if: inputs.projects-owner != ''
        shell: bash
        working-directory: project
        env:
          PROJECTS_TOOL: ${{ github.workspace }}/.profile-consistency-tooling/profile-consistency/sync_projects.py
          PROFILE_PATH: ${{ inputs.profile-path }}
          PROJECTS_OWNER: ${{ inputs.projects-owner }}
          PROJECTS_FORMAT: ${{ inputs.projects-format }}
          PROJECTS_EXCLUDE: ${{ inputs.projects-exclude }}
          SYNC_ATTEMPTS: ${{ inputs.attempts }}
          SYNC_RETRY_DELAY: ${{ inputs.retry-delay-seconds }}
          # Read-only use of the GitHub API (public repositories and releases).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/projects-output.txt"
          summary="$RUNNER_TEMP/projects-summary.md"
          attempts=$(( SYNC_ATTEMPTS < 1 ? 1 : SYNC_ATTEMPTS ))
          for attempt in $(seq 1 "$attempts"); do
            : > "$out"; : > "$summary"
            status=0
            python3 "$PROJECTS_TOOL" --profile "$PROFILE_PATH" --owner "$PROJECTS_OWNER" \
              --format "$PROJECTS_FORMAT" --exclude "$PROJECTS_EXCLUDE" --write \
              --pr-body "$RUNNER_TEMP/pr-body-projects.md" \
              --summary-file "$summary" --github-output "$out" || status=$?
            echo "Attempt $attempt/$attempts: projects sync exit code $status (0 done, 2 profile error, 3 GitHub unavailable)"
            if [ "$status" -ne 3 ] || [ "$attempt" -eq "$attempts" ]; then break; fi
            echo "GitHub data unavailable; retrying in ${SYNC_RETRY_DELAY}s."
            sleep "$SYNC_RETRY_DELAY"
          done
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          {
            cat "$out"
            echo "attempts-used=$attempt"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 3 ]; then
            echo "::warning title=Projects sync::GitHub data unavailable after $attempts attempts; the project list was not changed."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Combine the results
        id: combine
        shell: bash
        env:
          CATALOGUE_CHANGED: ${{ steps.sync.outputs.changed }}
          CATALOGUE_UNAVAILABLE: ${{ steps.sync.outputs.unavailable }}
          PROJECTS_CHANGED: ${{ steps.projects.outputs.changed }}
          PROJECTS_UNAVAILABLE: ${{ steps.projects.outputs.unavailable }}
          SOLUTION_COUNT: ${{ steps.sync.outputs.solutions }}
          # Not "GROUPS": that is a bash built-in array (the user's group ids).
          GROUP_COUNT: ${{ steps.sync.outputs.groups }}
          PROJECT_COUNT: ${{ steps.projects.outputs.projects }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pr-body.md"
          : > "$body"
          changed=false
          if [ "${CATALOGUE_CHANGED:-false}" = true ]; then
            changed=true
            cat "$RUNNER_TEMP/pr-body-catalogue.md" >> "$body"
            echo >> "$body"
          fi
          if [ "${PROJECTS_CHANGED:-false}" = true ]; then
            changed=true
            cat "$RUNNER_TEMP/pr-body-projects.md" >> "$body"
            echo >> "$body"
          fi
          if [ "${CATALOGUE_CHANGED:-false}" = true ] && [ "${PROJECTS_CHANGED:-false}" = true ]; then
            title="Sync profile: JSP-Product catalogue and open-source projects"
          elif [ "${CATALOGUE_CHANGED:-false}" = true ]; then
            title="Sync JSP-Product catalogue: ${SOLUTION_COUNT} solutions in ${GROUP_COUNT} groups"
          else
            title="Sync published open-source projects: ${PROJECT_COUNT} projects"
          fi
          echo "---" >> "$body"
          echo "Opened by the weekly profile sync. It is never merged automatically; please review before merging." >> "$body"
          unavailable=false
          if [ "${CATALOGUE_UNAVAILABLE:-false}" = true ] || [ "${PROJECTS_UNAVAILABLE:-false}" = true ]; then
            unavailable=true
          fi
          {
            echo "changed=$changed"
            echo "unavailable=$unavailable"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: pr
        if: steps.combine.outputs.changed == 'true'
        shell: bash
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
          PROFILE_PATH: ${{ inputs.profile-path }}
          TITLE: ${{ steps.combine.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -- "$PROFILE_PATH"
          git commit -m "$TITLE" -m "Automated update by the weekly profile sync."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
            url="$existing"
          else
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" \
              --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Close a pull request that is no longer needed
        if: steps.combine.outputs.changed == 'false' && steps.combine.outputs.unavailable == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            gh pr close "$existing" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "The profile already matches its sources, so this sync is no longer needed."
          fi
