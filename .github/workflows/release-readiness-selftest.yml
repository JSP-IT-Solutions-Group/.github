# Self-test for the reusable release-readiness workflow and its checker.
# Runs only in this repository; it does not publish anything.

name: Release readiness self-test

on:
  pull_request:
    paths:
      - ".github/workflows/release-readiness*.yml"
      - ".github/dependabot.yml"
      - "release-readiness/**"
      - "tests/release-readiness/**"
      - "workflow-templates/release-readiness*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-readiness*.yml"
      - ".github/dependabot.yml"
      - "release-readiness/**"
      - "tests/release-readiness/**"
      - "workflow-templates/release-readiness*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Run actionlint (includes shellcheck on run scripts)
        run: |
          "$RUNNER_TEMP/actionlint" -color \
            .github/workflows/*.yml \
            release-readiness/examples/*.yml \
            workflow-templates/*.yml
      - name: Validate JSON files
        run: |
          set -euo pipefail
          find release-readiness workflow-templates tests/release-readiness -name '*.json' -print0 |
            xargs -0 -n1 python3 -m json.tool --no-ensure-ascii > /dev/null

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests
        run: |
          python3 --version
          python3 -I -m py_compile release-readiness/release_readiness.py
          python3 -I -m unittest discover -s tests/release-readiness -v

  e2e-pass:
    name: E2E pass (${{ matrix.fixture }})
    strategy:
      fail-fast: false
      matrix:
        fixture: [python-pass, node-pass, dotnet-pass, cpp-pass]
    permissions:
      contents: read
    uses: ./.github/workflows/release-readiness.yml
    with:
      working-directory: tests/release-readiness/fixtures/${{ matrix.fixture }}
      tooling-ref: ${{ github.sha }}
      fail-on-warnings: true

  build-synthetic-artifact:
    name: Build synthetic artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create synthetic release files and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          printf 'synthetic linux build 2.0.0-rc.1\n' > synthetic-2.0.0-rc.1-linux-x64.tar.gz
          printf 'synthetic windows build 2.0.0-rc.1\n' > synthetic-2.0.0-rc.1-win-x64.zip
          sha256sum synthetic-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-release
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

  e2e-artifact:
    name: E2E downloaded artifact
    needs: build-synthetic-artifact
    permissions:
      contents: read
    uses: ./.github/workflows/release-readiness.yml
    with:
      working-directory: tests/release-readiness/fixtures/node-pass
      project-type: binary
      artifact-name: synthetic-release
      tooling-ref: ${{ github.sha }}

  e2e-fail:
    name: E2E expected failure
    permissions:
      contents: read
    uses: ./.github/workflows/release-readiness.yml
    with:
      working-directory: tests/release-readiness/fixtures/broken-release
      version: "1.2.0"
      enforce: false
      tooling-ref: ${{ github.sha }}

  assert-e2e:
    name: Assert E2E outcomes
    needs: [e2e-artifact, e2e-fail]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check reported results
        env:
          ARTIFACT_RESULT: ${{ needs.e2e-artifact.outputs.result }}
          ARTIFACT_VERSION: ${{ needs.e2e-artifact.outputs.version }}
          FAIL_RESULT: ${{ needs.e2e-fail.outputs.result }}
          FAIL_COUNT: ${{ needs.e2e-fail.outputs.failures }}
        run: |
          set -euo pipefail
          echo "artifact: result=$ARTIFACT_RESULT version=$ARTIFACT_VERSION"
          echo "broken:   result=$FAIL_RESULT failures=$FAIL_COUNT"
          test "$ARTIFACT_RESULT" = pass
          test "$ARTIFACT_VERSION" = 2.0.0-rc.1
          test "$FAIL_RESULT" = fail
          test "$FAIL_COUNT" -ge 4
